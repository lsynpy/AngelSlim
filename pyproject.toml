[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "angelslim"
dynamic = ["version"]
description = "A toolkit for compress llm model."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache Software License"}
authors = [
    {name = "Tencent Author"},
]
keywords = ["Tencent", "large language model", "model-optimize", "compression", "toolkit"]

dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.57.1",
    "safetensors>=0.5.3",
    "numpy",
    "tqdm",
    "triton",
    "pyarrow",
    "tiktoken",
    "datasets",
    "threadpoolctl",
    "shortuuid",
    "accelerate",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
all = [
    "fschat",
    "openai",
    "anthropic",
    "ray",
    "referencing",
    "jsonschema_specifications",
    "deepspeed",
    "wandb",
    "vllm>=0.11.0",
    "diffusers>=0.34.0",
    "qwen_vl_utils==0.0.11",
    "qwen_omni_utils",
]
speculative = [
    "fschat",
    "openai",
    "anthropic",
    "ray",
    "referencing",
    "jsonschema_specifications",
    "deepspeed",
    "wandb",
    "vllm>=0.11.0",
]
diffusion = [
    "diffusers>=0.34.0",
]
multimodal = [
    "qwen_vl_utils==0.0.11",
    "qwen_omni_utils",
]

[project.urls]
Homepage = "https://github.com/Tencent/AngelSlim"
Repository = "https://github.com/Tencent/AngelSlim"

[tool.setuptools.dynamic]
version = {attr = "angelslim.version.__version__"}

[tool.setuptools.packages.find]
where = [""]
include = ["angelslim*"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
]

[tool.ruff.lint.per-file-ignores]
"angelslim/compressor/quant/*" = ["ALL"]
"angelslim/compressor/diffusion/*" = ["ALL"]
"angelslim/compressor/speculative/benchmark/*" = ["ALL"]
"angelslim/compressor/speculative/train/*" = ["ALL"]
"angelslim/data/*" = ["ALL"]
"angelslim/models/*" = ["ALL"]
"angelslim/utils/*" = ["ALL"]
"tools/*" = ["ALL"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff]
line-length = 108

[tool.typos.files]
# these files may be written in non english words
extend-exclude = ["tests/models/fixtures/*", "tests/prompts/*",
    "benchmarks/sonnet.txt", "tests/lora/data/*", "build/*",
    "vllm/third_party/*", "docs/*", "dataset/*"]
ignore-hidden = true
ignore-files = true
ignore-dot = true
ignore-vcs = true
ignore-global = true
ignore-parent = true

[tool.typos.default]
binary = false
check-filename = false
check-file = true
unicode = true
ignore-hex = true
identifier-leading-digits = false
locale = "en"
extend-ignore-identifiers-re = ["NVML_*", ".*Unc.*", ".*_thw",
    ".*UE8M0.*", ".*[UE4M3|ue4m3].*", ".*eles.*",
     ".*[Tt]h[rR].*"]
extend-ignore-words-re = []
extend-ignore-re = []

[tool.typos.default.extend-identifiers]
bbc5b7ede = "bbc5b7ede"
womens_doubles = "womens_doubles"
v_2nd = "v_2nd"
# splitted_input = "splitted_input"
NOOPs = "NOOPs"
typ = "typ"
nin_shortcut = "nin_shortcut"
UperNetDecoder = "UperNetDecoder"
subtile = "subtile"
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"
SFOuput = "SFOuput"
# huggingface transformers repo uses these words
depthwise_seperable_out_channel = "depthwise_seperable_out_channel"
DepthWiseSeperableConv1d = "DepthWiseSeperableConv1d"
depthwise_seperable_CNN = "depthwise_seperable_CNN"

[tool.typos.default.extend-words]
iy = "iy"
tendencias = "tendencias"
# intel cpu features
tme = "tme"
dout = "dout"
Pn = "Pn"
arange = "arange"

